<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #696682;
        /* background: #222034; */
      }
      div {
        box-sizing: border-box;
      }
      #b {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
      }
      #con {
        width: 100%;
        position: relative;
      }
      #c {
        width: 100%;
        image-rendering: pixelated;
      }
      img {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="con">
      <canvas id="c" width="100" height="100"> </canvas>
      <div id="b">
        <button id="proto">FEED</button>
      </div>
    </div>
    <img id="cat" src="./cat.png"></img>
    <script type="module" src="./script.js"></script>
  </body>
</html>
