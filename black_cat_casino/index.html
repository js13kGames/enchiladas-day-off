<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #696682;
        /* background: #222034; */
      }
      div {
        box-sizing: border-box;
      }
      #b {
        display: flex;
        flex-direction: column;
        color: white;
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
      }
      #bars {
        display: flex;
        flex-direction: column;
      }
      #con {
        width: 100%;
        position: relative;
      }
      #c {
        width: 100%;
        image-rendering: pixelated;
        background: #222034;
      }
      img {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="con">
      <canvas id="c" width="100" height="100"> </canvas>
      <div id="b">
        <div id="menu">
          <button id="pause">Pause</button>
          <button id="next">Next</button>
          <button id="stuff">Feed</button>
          <button id="clean">Clean</button>
          <button id="play">Play</button>
          <button id="shop">Shop</button>
        </div>
        <div id="bars">
          <h2 id="cat_label">IDLE</h2>
          <h5 id="d_label"></h5>
          <label id="money_label">🧶 0</label>
          <label id="stamina_label" >⚡: 0</label>
          <progress id="stamina_bar" value="100" max="100"></progress>
          <label id="hunger_label">🍴: 0</label>
          <progress id="hunger_bar" value="0" max="100"></progress>
          <label id="poop_label">💩 0</label>
          <progress id="poop_bar" value="0" max="100"></progress>
          <label id="anger_label">😠 0</label>
          <progress id="anger_bar" value="0" max="100"></progress>
          <label id="food_label">🍗 0</label>
        </div>
      </div>
    </div>
    <img id="cat" src="./cat.png"></img>
    <script src="./m3.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
